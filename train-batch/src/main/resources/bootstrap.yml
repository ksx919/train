spring:
  application:
    # 注册中心的名字
    name: batch
  profiles:
    ## 启动环境，nacos会根据环境读不同的配置dataId：batch-dev.properties
    active: dev
  cloud:
    nacos:
      config:
        ## nacos server地址
        server-addr: 127.0.0.1:8848
        ## 配置中心文件后缀，默认properties
        file-extension: yml
        ## nacos命名空间
        namespace: train
      discovery:
        ## nacos server注册中心地址
        server-addr: 127.0.0.1:8848
        namespace: train
    sentinel:
      transport:
        # sentinel控台：https://github.com/alibaba/spring-cloud-alibaba/wiki/Sentinel
        port: 8719
        dashboard: localhost:18080
      datasource:
        degrade:
          nacos:
            # sentinel + nacos
            serverAddr: 127.0.0.1:8848
            namespace: train
            groupId: DEFAULT_GROUP
            dataId: sentinel-batch-degrade
            ruleType: degrade
    openfeign:
      # 上面改成true后，启动会报注入失败，需改成懒加载
      lazy-attributes-resolution: true
feign:
  sentinel:
    # sentinel默认不监控feign，需改成true，在簇点链路界面会显示资源：GET:http://business/business/hello
    enabled: true

