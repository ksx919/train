spring:
  application:
    # 注册中心的名字
    name: business
  profiles:
    ## 启动环境，nacos会根据环境读不同的配置dataId：business-dev.properties
    active: dev
  cloud:
    nacos:
      config:
        ## nacos server地址
        server-addr: 127.0.0.1:8848
        ## 配置中心文件后缀，默认properties
        file-extension: yml
        ## nacos命名空间
        namespace: train
      discovery:
        ## nacos server注册中心地址
        server-addr: 127.0.0.1:8848
        namespace: train

seata:
  tx-service-group: train-group
  service:
    vgroup-mapping:
      train-group: default
    grouplist:
      default: 120.26.29.90:8091