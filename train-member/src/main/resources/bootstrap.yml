spring:
  application:
    name: member

  profiles:
    active: dev
  cloud:
    nacos:
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yml
        namespace: train
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: train

seata:
  registry:
    # seata注册中心
    type: nacos
    nacos:
      application: seata-server
      server-addr: 127.0.0.1:8848
      group: SEATA_GROUP
      namespace: train
      username: nacos
      password: nacos
  config:
    # seata配置中心
    type: nacos
    nacos:
      server-addr: 127.0.0.1:8848
      group: SEATA_GROUP
      namespace: train
      dataId: seataServer.properties
      username: nacos
      password: nacos
  # 事务组名称，必须在nacos中有配置过：service.vgroupMapping.train-group=default
  tx-service-group: train-group
